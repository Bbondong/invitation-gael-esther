<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Invitations — Gaël & Esther</title>
<style>
  @font-face { font-family: "InviteSerif"; src: url("DejaVuSerif-Bold.ttf") format("truetype"); font-weight: 700; }
  :root { --gold: #c8b07c; --bg: #0d0c0c; --card: #171615; --line: #3a352c; --text: #f0eee7; --muted: #a39e92; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 24px; }
  @media (min-width: 900px) { main { grid-template-columns: 380px 1fr; align-items: start; } .panel { position: sticky; top: 20px; } }
  h1 { font-family: "InviteSerif", Georgia, serif; font-size: 22px; color: var(--gold); margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  label.field { display: block; font-size: 13px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: .6px; margin: 16px 0 6px; }
  input[type=text] { width: 100%; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #0f0e0d; color: var(--text); outline: none; }
  input[type=text]:focus { border-color: var(--gold); }
  .civ { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .civ input { display: none; }
  .civ span { display: block; text-align: center; padding: 10px 4px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; cursor: pointer; user-select: none; }
  .civ input:checked + span { background: var(--gold); color: #1a160f; border-color: var(--gold); font-weight: 700; }
  .actions { display: grid; gap: 10px; margin-top: 22px; }
  button { font-size: 16px; font-weight: 700; padding: 14px; border-radius: 12px; border: 1px solid var(--gold); cursor: pointer; }
  .primary { background: var(--gold); color: #1a160f; }
  .ghost { background: transparent; color: var(--gold); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
  .preview { display: flex; justify-content: center; }
  canvas { width: 100%; max-width: 620px; height: auto; border-radius: 6px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.8); }
  .history { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
  .history h2 { font-size: 13px; color: var(--gold); text-transform: uppercase; letter-spacing: .6px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .history h2 button { font-size: 12px; padding: 4px 8px; border-radius: 8px; font-weight: 600; }
  .history ol { margin: 0; padding-left: 20px; max-height: 220px; overflow: auto; font-size: 14px; color: var(--muted); }
  .history li span { color: var(--text); }
</style>
</head>
<body>
<main>
  <section class="panel" aria-label="Informations de l'invité">
    <h1>Invitations Gaël &amp; Esther</h1>
    <p class="sub">Saisissez l'invité et sa table : l'affiche se met à jour, puis téléchargez-la ou partagez-la.</p>

    <label class="field" for="nom">Nom de l'invité(e)</label>
    <input type="text" id="nom" placeholder="Ex. Famille Kabasele" autocomplete="off">

    <label class="field">Civilité</label>
    <div class="civ" role="radiogroup">
      <label><input type="radio" name="civ" value="" checked><span>Aucune</span></label>
      <label><input type="radio" name="civ" value="m"><span>M.</span></label>
      <label><input type="radio" name="civ" value="mme"><span>Mme</span></label>
      <label><input type="radio" name="civ" value="couple"><span>Couple</span></label>
    </div>

    <label class="field" for="table">Table</label>
    <input type="text" id="table" placeholder="Ex. 12 ou Famille" autocomplete="off" maxlength="30">

    <div class="actions">
      <button class="primary" id="download" disabled>Télécharger l'affiche (PNG)</button>
      <button class="ghost" id="share" hidden disabled>Partager (WhatsApp…)</button>
      <button class="ghost" id="next">Invité suivant</button>
    </div>
    <p class="hint" id="hint">Chargement de l'affiche…</p>

    <div class="history">
      <h2>Affiches générées <button class="ghost" id="clear" type="button">Effacer</button></h2>
      <ol id="list"></ol>
    </div>
  </section>

  <section class="preview" aria-label="Aperçu de l'affiche">
    <canvas id="poster" width="900" height="1200" aria-label="Aperçu de l'invitation personnalisée"></canvas>
  </section>
</main>

<script>
(() => {
  // Toutes les positions sont mesurées sur l'affiche de référence (900 × 1200 px).
  // Si vous remplacez affiche.jpg par une version plus grande (même mise en page),
  // tout est mis à l'échelle automatiquement.
  const REF_W = 900;
  const GOLD = "rgb(200,176,124)";
  const WHITE = "rgb(240,238,231)";
  const BG = "rgb(13,13,13)";
  const FONT = '"InviteSerif", "DejaVu Serif", Georgia, serif';

  const GUEST = { erase: [80, 709, 298, 54], labelY: 729, nameY: 757, centerX: 228, maxW: 290, size: 20, minSize: 11 };
  const TABLE = { erase: [100, 818, 256, 51], labelY: 836, valueY: 865, centerX: 228, maxW: 190, size: 22, minSize: 12 };
  const BOXES = { m: [156, 788, 165, 798], mme: [230, 789, 239, 797], couple: [317, 788, 326, 798] };

  const $ = (id) => document.getElementById(id);
  const canvas = $("poster"), ctx = canvas.getContext("2d");
  const nom = $("nom"), table = $("table"), hint = $("hint");
  const btnDl = $("download"), btnShare = $("share"), btnNext = $("next");
  const img = new Image();
  let ready = false, s = 1;

  function fitText(text, x, y, maxW, size, minSize, color) {
    let fs = size;
    ctx.font = `700 ${fs * s}px ${FONT}`;
    while (fs > minSize && ctx.measureText(text).width > maxW * s) {
      fs -= 0.5;
      ctx.font = `700 ${fs * s}px ${FONT}`;
    }
    ctx.fillStyle = color;
    ctx.fillText(text, x * s, y * s);
  }

  function rect(r) { ctx.fillStyle = BG; ctx.fillRect(r[0] * s, r[1] * s, r[2] * s, r[3] * s); }

  function check(box) {
    const [x0, y0, x1, y1] = box.map((v) => v * s);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 2.2 * s;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(x0 + 1.5 * s, (y0 + y1) / 2);
    ctx.lineTo(x0 + 4.5 * s, y1 - 1 * s);
    ctx.lineTo(x1 + 3 * s, y0 - 4 * s);
    ctx.stroke();
  }

  function draw() {
    if (!ready) return;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    const name = nom.value.trim();
    const tab = table.value.trim();
    const civ = document.querySelector('input[name="civ"]:checked').value;

    if (name) {
      rect(GUEST.erase);
      fitText("INVITÉ(E)", GUEST.centerX, GUEST.labelY, 200, 15, 15, GOLD);
      fitText(name, GUEST.centerX, GUEST.nameY, GUEST.maxW, GUEST.size, GUEST.minSize, WHITE);
    }
    if (civ && BOXES[civ]) check(BOXES[civ]);
    if (tab) {
      rect(TABLE.erase);
      fitText("TABLE", TABLE.centerX, TABLE.labelY, 200, 15, 15, GOLD);
      fitText(tab, TABLE.centerX, TABLE.valueY, TABLE.maxW, TABLE.size, TABLE.minSize, WHITE);
    }

    const ok = Boolean(name && tab);
    btnDl.disabled = !ok;
    btnShare.disabled = !ok;
    hint.textContent = ok ? "Prête : téléchargez ou partagez." : "Renseignez le nom et la table.";
  }

  function slug(t) {
    return t.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "invite";
  }
  const fileName = () => `invitation-${slug(nom.value)}-table-${slug(table.value)}.png`;
  const toBlob = () => new Promise((res) => canvas.toBlob(res, "image/png"));

  // Historique local (navigateur de l'appareil uniquement).
  const KEY = "invitations-gael-esther";
  function loadList() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } }
  function saveList(l) { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch {} }
  function renderList() {
    const l = loadList();
    $("list").innerHTML = l.length ? "" : '<li style="list-style:none;margin-left:-20px">Aucune pour l\'instant.</li>';
    l.forEach((e) => {
      const li = document.createElement("li");
      li.innerHTML = `<span></span> · table <span></span>`;
      li.children[0].textContent = e.n;
      li.children[1].textContent = e.t;
      $("list").appendChild(li);
    });
  }
  function remember() {
    const l = loadList();
    const n = nom.value.trim(), t = table.value.trim();
    if (!l.some((e) => e.n === n && e.t === t)) { l.push({ n, t }); saveList(l); renderList(); }
  }

  btnDl.addEventListener("click", async () => {
    const blob = await toBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    remember();
    hint.textContent = "Téléchargée : " + fileName();
  });

  btnShare.addEventListener("click", async () => {
    try {
      const file = new File([await toBlob()], fileName(), { type: "image/png" });
      await navigator.share({ files: [file], title: "Invitation au mariage de Gaël & Esther" });
      remember();
    } catch (e) { if (e && e.name !== "AbortError") hint.textContent = "Partage impossible, utilisez Télécharger."; }
  });

  btnNext.addEventListener("click", () => {
    nom.value = ""; table.value = "";
    document.querySelector('input[name="civ"][value=""]').checked = true;
    draw(); nom.focus();
  });

  $("clear").addEventListener("click", () => {
    if (confirm("Effacer la liste des affiches générées ?")) { saveList([]); renderList(); }
  });

  [nom, table].forEach((el) => el.addEventListener("input", draw));
  document.querySelectorAll('input[name="civ"]').forEach((el) => el.addEventListener("change", draw));

  (async () => {
    try {
      const face = new FontFace("InviteSerif", 'url("DejaVuSerif-Bold.ttf")', { weight: "700" });
      document.fonts.add(await face.load());
    } catch {}
    img.onload = () => {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      s = img.naturalWidth / REF_W;
      ready = true;
      draw();
    };
    img.onerror = () => { hint.textContent = "Impossible de charger affiche.jpg."; };
    img.src = "affiche.jpg";
    try {
      const probe = new File([new Blob(["x"])], "x.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [probe] })) btnShare.hidden = false;
    } catch {}
    renderList();
  })();
})();
</script>
</body>
</html>
